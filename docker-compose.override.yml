# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
  api:
    image: librechat
    build:
      context: .
      target: node
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./client/dist
        target: /app/client/dist
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    restart: always
  # ---- Self-hosted Firecrawl (used as the webSearch scraperProvider) ----
  # Prebuilt images from the official self-host compose file, renamed to
  # avoid clashing with LibreChat's own `api` service.
  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${FIRECRAWL_CRAWL_CONCURRENCY:-10}
  firecrawl-redis:
    image: redis:alpine
    container_name: firecrawl-redis
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0
  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: firecrawl-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl}
      POSTGRES_DB: postgres
    volumes:
      - firecrawl_pgdata:/var/lib/postgresql/data
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl-api
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl}
      POSTGRES_DB: postgres
      USE_DB_AUTHENTICATION: "false"
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      NUM_WORKERS_PER_QUEUE: 8
      BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY}
      TEST_API_KEY: ${FIRECRAWL_TEST_API_KEY}
    ports:
      - "3002:3002"
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started
  # USE RAG API IMAGE WITH LOCAL EMBEDDINGS SUPPORT
  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev:latest
  gebra-knowledge-mcp:
    build: ./gebra-knowledge/app
    image: gebra-knowledge-app
    container_name: gebra-knowledge-mcp
    environment:
      - DB_HOST=vectordb
      - DB_PORT=5432
      - POSTGRES_DB=global_knowledge
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - EMBEDDINGS_MODEL=intfloat/multilingual-e5-small
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    depends_on:
      - vectordb
  gebra-knowledge-ingest:
    build: ./gebra-knowledge/app
    image: gebra-knowledge-app
    container_name: gebra-knowledge-ingest
    profiles: ["tools"]
    entrypoint: ["python", "ingest.py"]
    environment:
      - DB_HOST=vectordb
      - DB_PORT=5432
      - POSTGRES_DB=global_knowledge
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - EMBEDDINGS_MODEL=intfloat/multilingual-e5-small
      - DOCS_DIR=/app/docs
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./gebra-knowledge/docs:/app/docs:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - vectordb

volumes:
  hf_cache:
  firecrawl_pgdata:

